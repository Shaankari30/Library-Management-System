{% extends "base.html" %}{% block title %}Add user{% endblock %}
{% block content %}
<h1>{{ 'Add user' if user.role == 'admin' else 'Register student' }}</h1>
<form class="card form" method="post"><input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Full name</label><input name="full_name" value="{{ f.full_name }}" required>
  <label>Username</label><input name="username" value="{{ f.username }}" required>
  <label>Email</label><input name="email" type="email" value="{{ f.email }}">
  <label>Temporary password (min 8 characters)</label><input name="password" type="password" required>
  {% if user.role == 'admin' %}<label>Role</label>
  <select name="role">{% for r in ('student', 'librarian', 'admin') %}<option value="{{ r }}" {{ 'selected' if f.role == r }}>{{ r }}</option>{% endfor %}</select>{% endif %}
  <p><button class="btn">Create</button> <a class="btn ghost" href="{{ url_for('users') }}">Cancel</a></p>
</form>
{% endblock %}
