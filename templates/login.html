{% extends "base.html" %}{% block title %}Sign in{% endblock %}
{% block content %}
<div class="login card">
  <h1>📚 LibraryHub</h1><p class="muted">Sign in to continue</p>
  <form method="post"><input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Username</label><input name="username" autofocus required>
    <label>Password</label><input name="password" type="password" required>
    <p><button class="btn" style="width:100%">Sign in</button></p>
  </form>
</div>
{% endblock %}
